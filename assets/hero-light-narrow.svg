      </path>
      <path d="M30 430 C120 430 150 360 240 352 C330 344 370 410 450 418 C520 426 555 368 610 380 L610 718 L30 718 Z" fill="#C9E0D6"/>
<path d="M30 500 C140 478 200 440 310 452 C430 466 480 520 610 490 L610 718 L30 718 Z" fill="#8FC4B0"/>
<path d="M30 560 C160 540 260 590 400 572 C500 558 560 530 610 548 L610 718 L30 718 Z" fill="#157A62"/>
      <path d="M40 470 C110 456 150 408 230 400 C320 390 360 452 450 448 C520 444 560 408 604 420" fill="none" stroke="#FFFDF8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"
