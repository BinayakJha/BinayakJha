            <path d="M574.5 416 v-4 M578.8 416 v-7 M583.2 416 v-10" stroke="#0F6E56" stroke-width="1.8" stroke-linecap="round"/><animate attributeName="opacity" values="0;0;1" dur="4.2s" fill="freeze" keyTimes="0;0.62;0.78"/></g>
      <g>
