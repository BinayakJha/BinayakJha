<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" role="img">
  <title>Speak, and a world appears</title>
  <desc>A sentence resolves into a small landscape with a path, three marks, and a diagram.</desc>
  <rect width="640" height="760" fill="#FBF8F4"/>
  <defs>
    <clipPath id="type"><rect x="32" y="72" width="520" height="110"><animate attributeName="width" values="0;0;520" dur="2.15s" fill="freeze" keyTimes="0;0.12;1" calcMode="spline" keySplines="0.2 0.8 0.2 1;0.16 0.84 0.32 1"/></rect></clipPath>
    <clipPath id="plate">
      <rect x="30" y="206" width="580" height="512" rx="12"/>
    </clipPath>
  </defs>
  
    <text x="36" y="58" fill="#E15A3A" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Noto Serif', 'Times New Roman', serif" font-style="italic" font-size="24" opacity="1">
      Speak,
      <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze"/>
    </text>
    <g clip-path="url(#type)">
      <text x="36" y="112" fill="#1C1915" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Noto Serif', 'Times New Roman', serif" font-size="40">and a world</text>
      <text x="36" y="164" fill="#0F6E56" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Noto Serif', 'Times New Roman', serif" font-size="46">appears.</text>
    </g>
  
    <g fill="none" stroke="#E15A3A" stroke-linecap="round">
      <circle cx="560" cy="86" r="2.5" fill="#E15A3A" stroke="none"/>
      <path d="M566.2 79.8 a9.4 9.4 0 0 1 0 12.5" stroke-width="1.64">
        <animate attributeName="opacity" values="0.30;1;0.30" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M570.9 74.3 a15.6 15.6 0 0 1 0 23.4" stroke-width="1.64" opacity="0.75">
        <animate attributeName="opacity" values="0.18;0.85;0.18" dur="2.6s" repeatCount="indefinite" begin="0.28s"/>
      </path>
      <path d="M575.6 68.8 a21.8 21.8 0 0 1 0 34.3" stroke-width="1.64" opacity="0.45">
        <animate attributeName="opacity" values="0.08;0.6;0.08" dur="2.6s" repeatCount="indefinite" begin="0.56s"/>
      </path>
    </g>
  
    <rect x="20" y="196" width="600" height="532" rx="18" fill="#E5F2EC" stroke="#D5E6DE" stroke-width="1.75"/>
    <rect x="30" y="206" width="580" height="512" rx="12" fill="none" stroke="#D5E6DE" stroke-width="1" opacity="0.85"/>
  
    <g clip-path="url(#plate)">
      <rect x="20" y="196" width="600" height="532" fill="#E5F2EC"/>
      
      <circle cx="520" cy="268" r="44" fill="none" stroke="#E0A322" stroke-width="1.6" opacity="0.4">
        <animate attributeName="opacity" values="0.18;0.55;0.18" dur="5.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="268" r="28" fill="#E0A322"/>
      <path d="M44 268 q16 -16 32 0 t32 0 t32 0 t32 0" fill="none" stroke="#E15A3A" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
