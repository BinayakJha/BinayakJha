        <circle r="4.5" fill="#E15A3A"/>
        <animateMotion dur="14s" repeatCount="indefinite" rotate="0" path="M40 470 C110 456 150 408 230 400 C320 390 360 452 450 448 C520 444 560 408 604 420"/>
