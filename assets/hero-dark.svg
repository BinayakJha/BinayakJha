      </path>
      <path d="M58.9 82.2 a18.4 18.4 0 0 1 0 27.6" stroke-width="1.93" opacity="0.75">
        <animate attributeName="opacity" values="0.18;0.85;0.18" dur="2.6s" repeatCount="indefinite" begin="0.28s"/>
