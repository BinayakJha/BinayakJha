<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img">
  <title>Speak, and a world appears</title>
  <desc>A sentence resolves into a small landscape with a path, three marks, and a diagram.</desc>
  <rect width="960" height="560" fill="#0D1117"/>
  <defs>
    <clipPath id="type"><rect x="108" y="86" width="640" height="72"><animate attributeName="width" values="0;640" dur="1.7s" fill="freeze" calcMode="spline" keySplines="0.16 0.84 0.3 1"/></rect></clipPath>
    <clipPath id="plate">
      <rect x="50" y="178" width="860" height="340" rx="12"/>
    </clipPath>
  </defs>
  
    <text x="112" y="68" fill="#FF8B6A" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Noto Serif', 'Times New Roman', serif" font-style="italic" font-size="28" opacity="1">
      Speak,
      <animate attributeName="opacity" values="0;1" dur="0.55s" fill="freeze"/>
    </text>
    
    <line x1="116" y1="80" x2="184" y2="80" stroke="#FF8B6A" stroke-width="2" stroke-linecap="round"
          pathLength="100" stroke-dasharray="100" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </line>
    <g clip-path="url(#type)">
      <text x="112" y="134" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Noto Serif', 'Times New Roman', serif" font-size="48">
        <tspan fill="#F4EFE6">and a world </tspan><tspan fill="#6EE0B8">appears.</tspan>
      </text>
    </g>
  
    <g fill="none" stroke="#FF8B6A" stroke-linecap="round">
